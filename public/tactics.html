<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题型练习 · 国际象棋 — S.T.A.R.</title>
<script>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push(String(e.message||e))});</script>
<link rel="stylesheet" href="css/site.css?v=32">
<link rel="stylesheet" href="css/motion.css?v=35">
<link rel="stylesheet" href="css/chessboard.min.css?v=26">
<style>
  /* 与 chess.html 一致的视口预算布局 */
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  .tac-wrap { flex: 1; min-height: 0; display: flex; gap: 20px; align-items: center;
    justify-content: center; padding: 12px 16px; flex-wrap: nowrap; }
  #board { width: min(460px, calc(100vw - 32px)); height: auto; flex-shrink: 0; }
  #board .chessboard { border-radius: 8px; overflow: hidden; }
  .side { width: 340px; flex: none; max-height: 100%; min-height: 0;
    display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .mod { min-width: 0; border: 1px solid var(--line); background: var(--surface);
    border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column;
    gap: 6px; overflow: hidden; }
  .mod h3 { margin: 0; font-size: 14px; }
  /* 顶部标签：题库练习 / 每日残局 */
  .tabs { display: flex; gap: 6px; }
  .tab { flex: 1; padding: 9px 0; border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-size: 13px; border-radius: 5px; cursor: pointer; transition: .15s; }
  .tab.active { background: var(--signal); color: #080a09; font-weight: 700; border-color: var(--signal); }
  .tier-row { display: flex; gap: 6px; }
  .tier-btn { flex: 1; padding: 8px 0; border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-size: 12.5px; border-radius: 5px; cursor: pointer; transition: .15s; }
  .tier-btn.active { background: var(--signal); color: #080a09; font-weight: 700; border-color: var(--signal); }
  .prog { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--signal); transition: width .3s; }
  /* 连击徽章栏 */
  .streak-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 12px; color: var(--muted); }
  .streak-bar b { color: var(--signal); font-family: ui-monospace, Menlo, monospace; }
  /* 称号栏 */
  .title-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .title-chip { font-size: 11px; padding: 3px 9px; border: 1px solid var(--line);
    border-radius: 4px; color: var(--faint); position: relative; cursor: default; }
  .title-chip.unlocked { color: var(--signal); border-color: var(--signal);
    background: rgba(215,255,63,0.08); }
  .title-chip .mini { display: block; font-size: 9px; color: var(--faint); margin-top: 1px; }
  .title-chip.unlocked .mini { color: var(--signal); }
  /* 档位关卡进度 */
  .tier-btn .lv { display: block; font-size: 9.5px; opacity: .75; font-weight: 400;
    font-family: ui-monospace, Menlo, monospace; margin-top: 1px; }
  #themes { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 10.5px; padding: 2px 7px; border: 1px solid var(--signal); color: var(--signal);
    border-radius: 3px; font-family: ui-monospace, Menlo, monospace; }
  #status { font-size: 13.5px; color: var(--muted); line-height: 1.65; min-height: 44px; }
  #status.good { color: #7ec96a; } #status.bad { color: #ff5a4d; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .btns .btn { flex: 1; min-width: 84px; }
  #explain { font-size: 12.5px; color: var(--muted); line-height: 1.7;
    border-top: 1px solid var(--line); padding-top: 8px; overflow-y: auto; flex: 1; min-height: 0; }
  /* 提示高亮：from 蓝 / to 黄 */
  #board .square-55d63 { position: relative; }
  .tac-hl-from { box-shadow: inset 0 0 0 4px rgba(46,211,255,.85); }
  .tac-hl-to { box-shadow: inset 0 0 0 4px rgba(215,255,63,.9); }
  .shake { animation: shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @media (max-width: 960px) {
    html, body { height: auto; overflow: auto; }
    body { display: block; }
    .tac-wrap { flex-wrap: wrap; }
    .side { width: min(460px, 100%); max-height: none; }
    #explain { flex: none; max-height: 200px; }
  }
  /* 窄屏顶栏规则已统一移到 css/motion.css（全局），此处不再重复 */
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="pixel-fault" aria-hidden="true"></div>
<div class="topbar">
  <a href="index.html" class="logo" data-nav>S.T.A.R.</a>
  <span class="crumb">TACTICS / CHESS TRAINING</span>
  <span class="flex1"></span>
  <a href="chess.html" class="btn" data-nav>实战对弈 →</a>
  <a href="account.html" class="account-entry" data-nav>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 21c.7-4 3-6 7-6s6.3 2 7 6"/></svg>
    <span class="txt">我的账号</span>
  </a>
</div>

<div class="tac-wrap">
  <div id="board"></div>
  <div class="side">
    <section class="mod">
      <div class="tabs">
        <button class="tab active" data-tab="level">关卡闯关</button>
        <button class="tab" data-tab="daily">每日残局</button>
      </div>
      <div id="level-only" style="display:flex;flex-direction:column;gap:6px">
        <div class="tier-row" id="tiers"></div>
        <div class="prog"><i id="prog" style="width:0%"></i></div>
        <div style="font-size:11px;color:var(--faint);font-family:ui-monospace,Menlo,monospace" id="pinfo"></div>
      </div>
      <div id="daily-only" style="display:none;gap:6px;flex-direction:column">
        <div id="dinfo" style="font-size:11px;color:var(--faint);font-family:ui-monospace,Menlo,monospace"></div>
      </div>
      <div class="streak-bar">
        <span>⚔ 当前连胜 <b id="streak-cur">0</b> · 最佳 <b id="streak-best">0</b> · 累计过关 <b id="total-pass">0</b></span>
      </div>
      <div class="title-bar" id="titles-bar"></div>
    </section>
    <section class="mod">
      <h3 id="ptitle">题型</h3>
      <div id="themes"></div>
      <div id="status">加载题库中…</div>
      <div class="btns">
        <button class="btn" id="btn-hint">提示</button>
        <button class="btn" id="btn-retry">重做</button>
        <button class="btn" id="btn-next">下一关</button>
      </div>
    </section>
    <section class="mod" style="flex:1 1 auto; min-height:0">
      <h3>解析</h3>
      <div id="explain">解答正确后显示题型讲解；「提示」会在棋盘上高亮应走的起止格。</div>
    </section>
  </div>
</div>

<script src="js/lib/jquery.min.js?v=26"></script>
<script src="js/lib/chess.min.js?v=26"></script>
<script src="js/lib/chessboard.min.js?v=26"></script>
<script src="js/tactics.js?v=8"></script>
<script src="js/motion.js?v=35"></script>
<script>
  if (window.Motion) { Motion.initCursorLine(); Motion.initRipple(); Motion.initMagnetic(); Motion.staggerEnter(); }
</script>
</body>
</html>
