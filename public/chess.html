<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际象棋 · AI 下一步推荐 — S.T.A.R.</title>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/chessboard.min.css">
<style>
  .chess-wrap { display: flex; gap: 24px; align-items: flex-start; justify-content: center; flex-wrap: wrap; padding: 22px 16px; }
  .board-card { width: 480px; max-width: 100%; }
  .board-card .chessboard { border-radius: 8px; overflow: hidden; }
  #board { width: 460px; max-width: 100%; }
  #evalwrap { width: 16px; border-radius: 4px; overflow: hidden; border: 1px solid #3a4048; display: flex; flex-direction: column; background: #2b2b2b; }
  #evalfill { background: #f2f2f2; width: 100%; height: 50%; transition: height .35s ease; }
  .panel { width: 300px; }
  .cand { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); margin-bottom: 8px; background: var(--surface); }
  .cand .n { width: 22px; height: 22px; border-radius: 50%; background: var(--signal); color: #080a09; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 12px; flex: 0 0 22px; }
  .cand .pv { flex: 1; font-family: ui-monospace, Menlo, monospace; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cand .score { font-family: monospace; color: var(--muted); font-size: 12px; }
  .moves { margin-top: 8px; height: 200px; overflow-y: auto; font-size: 13px; border-top: 1px solid var(--line); padding-top: 8px; }
  .moves table { width: 100%; border-collapse: collapse; }
  .moves td { padding: 2px 4px; }
  .moves .num { color: var(--faint); width: 26px; }
  .moves .mv { font-family: ui-monospace, Menlo, monospace; cursor: pointer; }
  .moves .mv:hover { color: var(--signal); }
  /* 点击式下棋：棋格定位 + 高亮 overlay */
  .board-b72b1 .square-55d63 { position: relative; }
  .star-hl { position: absolute; pointer-events: none; }
  .star-hl.sel { inset: 0; background: rgba(215,255,63,.30); }
  .star-hl.dot { left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; background: rgba(215,255,63,.50); }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="pixel-fault" aria-hidden="true"></div>
<div class="topbar">
  <a href="index.html" class="logo" data-nav>←</a>
  <span class="crumb">CHESS / STOCKFISH ANALYSIS</span>
  <span class="flex1"></span>
  <a href="go.html" class="btn" data-nav>围棋 →</a>
</div>

<div class="chess-wrap enter-node">
  <div class="board-card" style="display:flex;gap:10px;align-items:stretch">
    <div id="evalwrap"><div id="evalfill"></div></div>
    <div id="board"></div>
  </div>

  <div class="panel">
    <div class="row"><label>引擎</label>
      <select id="engine">
        <option value="stockfish">Stockfish 18</option>
        <option value="reckless">Reckless 0.10</option>
      </select>
    </div>
    <div class="row"><label>你的执棋方</label>
      <select id="side"><option value="white">白方（先手）</option><option value="black">黑方（后手）</option></select>
    </div>
    <div class="row"><label>难度（引擎棋力，Reckless 固定）</label>
      <select id="level">
        <option value="1320">新手 ~1320</option><option value="1500">业余 ~1500</option>
        <option value="1800" selected>中级 ~1800</option><option value="2100">高级 ~2100</option>
        <option value="2600">大师 ~2600</option><option value="0">最强（满血）</option>
      </select>
    </div>
    <div class="row"><label>引擎思考时间：<span id="mtlbl">800</span> ms</label>
      <input id="movetime" type="range" min="200" max="3000" step="100" value="800" style="width:100%">
    </div>
    <div class="row btns">
      <button class="btn primary" onclick="engineThink()">AI 推荐下一步</button>
      <button class="btn" onclick="reviewGame()">结束复盘</button>
      <button class="btn" onclick="newGame()">新对局</button>
      <button class="btn" onclick="undo()">悔棋</button>
      <button class="btn" onclick="flipBoard()">翻转</button>
    </div>
    <div class="status" id="status">准备就绪</div>
    <div class="thinking" id="thinking">Stockfish 分析中…</div>
    <div class="row" style="margin-top:12px"><label>胜率评估</label>
      <div class="wrbar"><span id="wrfill" style="width:50%"></span></div>
      <div class="wrmono" id="wrlabel">白 50.0% · 黑 50.0%</div>
    </div>
    <div class="row" style="margin-top:12px"><label>推荐走法（当前行棋方）</label><div id="cands"></div></div>
    <div class="row"><div id="evaltxt" style="font-size:13px;color:var(--muted);font-family:monospace">评估：—</div></div>
    <div class="row moves"><table id="movelist"><tbody></tbody></table></div>
  </div>
</div>

<script src="js/lib/jquery.min.js"></script>
<script src="js/lib/chess.min.js"></script>
<script src="js/lib/chessboard.min.js"></script>
<script src="js/chess.js?v=17"></script>
<script src="js/motion.js?v=2"></script>
<script>
  Motion.initCursorLine();
  Motion.initRipple();
  Motion.staggerEnter();
  document.querySelectorAll("[data-nav]").forEach(a => {
    a.addEventListener("click", e => { e.preventDefault(); Motion.sliceRoute(a.getAttribute("href")); });
  });
</script>
</body>
</html>
