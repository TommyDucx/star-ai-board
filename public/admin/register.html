<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.T.A.R. 后台 · 注册</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="../css/motion.css">
</head>
<body class="login-body">
<div class="scanlines" aria-hidden="true"></div>
<div class="login-wrap">
  <div class="login-card enter-node magnetic ripple-host" style="width:380px">
    <div class="login-logo">S.T.A.R.<span>· ADMIN</span></div>
    <div class="login-sub">注册新账号 · 开放自助注册</div>
    <form id="reg-form" autocomplete="off">
      <label>用户名
        <input type="text" id="username" placeholder="2-32 位字母数字/._-" required>
      </label>
      <label>密码
        <input type="password" id="password" placeholder="8+ 位，含大小写与数字" required>
      </label>
      <label>确认密码
        <input type="password" id="password2" placeholder="再次输入密码" required>
      </label>
      <div id="err" class="login-err"></div>
      <button type="submit" id="submit-btn">注 册</button>
    </form>
    <div class="login-links">
      <a href="login.html">已有账号？登录</a>
    </div>
    <div class="login-foot">本地部署 · 数据不出树莓派</div>
  </div>
</div>
<script src="../js/motion.js?v=33"></script>
<script>
Motion.initCursorLine();
Motion.initRipple();
Motion.initMagnetic();
Motion.staggerEnter();

const $ = s => document.querySelector(s);
const errEl = $("#err"), btn = $("#submit-btn");

$("#reg-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  errEl.textContent = "";
  const username = $("#username").value.trim();
  const password = $("#password").value, password2 = $("#password2").value;
  if (password !== password2) { errEl.textContent = "两次密码不一致"; return; }
  btn.disabled = true; btn.textContent = "注册中…";
  try {
    const r = await fetch("/api/register", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.error || "注册失败"; btn.disabled = false; btn.textContent = "注 册"; return; }
    location.href = "index.html";
  } catch (e) { errEl.textContent = "网络错误"; btn.disabled = false; btn.textContent = "注 册"; }
});
</script>
</body>
</html>
