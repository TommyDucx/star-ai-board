<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.T.A.R. 后台 · 重置密码</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="../css/motion.css">
</head>
<body class="login-body">
<div class="scanlines" aria-hidden="true"></div>
<div class="login-wrap">
  <div class="login-card enter-node magnetic ripple-host" style="width:380px">
    <div class="login-logo">S.T.A.R.<span>· ADMIN</span></div>
    <div class="login-sub">重置密码 · 单次有效链接</div>
    <form id="reset-form" autocomplete="off">
      <label>联系方式类型
        <select id="contactType">
          <option value="email">邮箱</option>
          <option value="phone">手机号</option>
        </select>
      </label>
      <label>联系方式
        <input type="text" id="contact" placeholder="注册时使用的联系方式" required>
      </label>
      <div id="err" class="login-err"></div>
      <div id="code-hint"></div>
      <button type="submit" id="step1-btn">发送重置链接</button>
    </form>

    <form id="reset2-form" autocomplete="off" style="display:none; margin-top:18px; border-top:1px solid var(--line); padding-top:18px">
      <div class="login-sub" style="margin:0 0 14px">第 2 步 · 设置新密码</div>
      <label>重置令牌（Token）
        <input type="text" id="token" placeholder="重置链接中的 token" required>
      </label>
      <label>新密码
        <input type="password" id="password" placeholder="8+ 位，含大小写与数字" required>
      </label>
      <label>确认新密码
        <input type="password" id="password2" placeholder="再次输入" required>
      </label>
      <div id="err2" class="login-err"></div>
      <button type="submit" id="step2-btn">重置密码</button>
    </form>

    <div class="login-links">
      <a href="login.html">返回登录</a>
    </div>
    <div class="login-foot">本地部署 · 数据不出树莓派</div>
  </div>
</div>
<script src="../js/motion.js?v=33"></script>
<script>
Motion.initCursorLine();
Motion.initRipple();
Motion.initMagnetic();
Motion.staggerEnter();

const $ = s => document.querySelector(s);
const errEl = $("#err"), err2El = $("#err2"), hintEl = $("#code-hint");
const f1 = $("#reset-form"), f2 = $("#reset2-form");

// 若 URL 带 token，直接进入第 2 步
const urlToken = new URLSearchParams(location.search).get("token");
if (urlToken) { f1.style.display = "none"; f2.style.display = "block"; $("#token").value = urlToken; }

f1.addEventListener("submit", async (e) => {
  e.preventDefault(); errEl.textContent = ""; hintEl.innerHTML = "";
  const contactType = $("#contactType").value, contact = $("#contact").value.trim();
  if (!contact) { errEl.textContent = "请填写联系方式"; return; }
  $("#step1-btn").disabled = true;
  try {
    const r = await fetch("/api/auth/request-reset", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contactType, contact }),
    });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.error || "发送失败"; $("#step1-btn").disabled = false; return; }
    if (d.dev && d.token) {
      hintEl.innerHTML = '<div class="code-hint">本地模式重置链接已生成：<br><b style="font-size:12px">reset.html?token=' + d.token + '</b><br>已自动填入下方，直接设置新密码即可。</div>';
      f1.style.display = "none"; f2.style.display = "block"; $("#token").value = d.token;
    } else {
      hintEl.innerHTML = '<div class="code-hint">' + (d.message || "若该联系方式已注册，重置链接将发送至此。") + '</div>';
    }
    $("#step1-btn").disabled = false;
  } catch (e) { errEl.textContent = "网络错误"; $("#step1-btn").disabled = false; }
});

f2.addEventListener("submit", async (e) => {
  e.preventDefault(); err2El.textContent = "";
  const token = $("#token").value.trim();
  const password = $("#password").value, password2 = $("#password2").value;
  if (password !== password2) { err2El.textContent = "两次密码不一致"; return; }
  $("#step2-btn").disabled = true; $("#step2-btn").textContent = "重置中…";
  try {
    const r = await fetch("/api/auth/reset-password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, newPassword: password }),
    });
    const d = await r.json();
    if (!r.ok) { err2El.textContent = d.error || "重置失败"; $("#step2-btn").disabled = false; $("#step2-btn").textContent = "重置密码"; return; }
    hintEl.innerHTML = '<div class="code-hint" style="color:var(--signal)">密码已重置，请重新登录。</div>';
    setTimeout(() => location.href = "login.html", 800);
  } catch (e) { err2El.textContent = "网络错误"; $("#step2-btn").disabled = false; $("#step2-btn").textContent = "重置密码"; }
});
</script>
</body>
</html>
