<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.T.A.R. 后台 · 登录</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="../css/motion.css">
</head>
<body class="login-body">
<div class="scanlines" aria-hidden="true"></div>
<div class="login-wrap">
  <div class="login-card enter-node magnetic ripple-host">
    <div class="login-logo">S.T.A.R.<span>· ADMIN</span></div>
    <div class="login-sub">后台管理系统 · 仅授权人员</div>
    <form id="login-form" autocomplete="off">
      <label>账号
        <input type="text" id="username" name="username" placeholder="admin" required>
      </label>
      <label>密码
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </label>
      <div id="err" class="login-err"></div>
      <button type="submit" id="submit-btn" class="ripple-host">登 录</button>
    </form>
    <div class="login-links">
      <a href="register.html">注册新账号</a>
      <span class="dot">·</span>
      <span class="muted" style="font-size:12px">忘记密码请联系管理员重置</span>
    </div>
    <div class="login-foot">本地部署 · 数据不出树莓派</div>
  </div>
</div>
<script src="../js/motion.js?v=33"></script>
<script>
// 站点同款动效初始化（与 main.html / chess.html 一致）
Motion.initCursorLine();
Motion.initRipple();
Motion.initMagnetic();
Motion.staggerEnter();

const form = document.getElementById("login-form");
const errEl = document.getElementById("err");
const btn = document.getElementById("submit-btn");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errEl.textContent = "";
  btn.disabled = true; btn.textContent = "登录中…";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.error || "登录失败"; btn.disabled = false; btn.textContent = "登 录"; return; }
    // 跳转到看板；若需强制改密，带 ?change=1 由看板弹窗
    location.href = data.mustChange ? "index.html?change=1" : "index.html";
  } catch (e) {
    errEl.textContent = "网络错误";
    btn.disabled = false; btn.textContent = "登 录";
  }
});
</script>
</body>
</html>
