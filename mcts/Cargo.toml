[package]
name = "biaozi-mcts"
version = "0.1.0"
edition = "2024"

[dependencies]
chess = "3.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_distr = "0.4"
flate2 = "1"

[[bin]]
name = "mcts-selfplay"
path = "src/bin/selfplay.rs"

[[bin]]
name = "mcts-uci"
path = "src/bin/uci.rs"

[profile.release]
opt-level = 3
lto = "thin"
